# CI for Jehovah's Light (Next.js 16, output: 'standalone').
# Next.js 16 requires Node >= 20.9. This job uses Node 22 (current LTS).
#
# Develop SSH deploy lives in this workflow (not a separate workflow_run
# file). The repo default branch is `main`, so a workflow_run trigger
# added only on `develop` would never take effect. Do not change the
# default branch. Production CD stays out of scope.
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  # Manual redeploy: CI still runs first; deploy job is gated to develop.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs. Never cancel a develop run — that would
  # interrupt an in-progress SSH deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  # Harmless placeholders so `next build` can see the same keys as .env.example.
  # DB_* is used at runtime by Drizzle (src/lib/db) and by `npm run db:migrate`.
  # NEXT_PUBLIC_APP_URL is unused in source today but listed in .env.example.
  # PORT is never written into package.json — "start" stays "next start".
  CI: true
  PORT: "3000"
  DB_HOST: 127.0.0.1
  DB_USER: ci
  DB_PASSWORD: ci
  DB_NAME: ci
  NEXT_PUBLIC_APP_URL: https://example.invalid

jobs:
  lint-and-build:
    name: lint, build, and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test NEXT_PUBLIC_APP_URL deploy guard
        run: bash deploy/check-app-url.test.sh

      - name: Build
        run: npm run build

      # postbuild copies public + .next/static into the standalone tree.
      - name: Verify standalone public assets
        run: test -f .next/standalone/public/globe/earth-blue-marble.jpg

      - name: Drizzle kit check
        run: npm run db:check

      - name: Migrate against ephemeral MySQL
        run: npm run db:migrate

      - name: Re-run migrate (idempotent IF NOT EXISTS)
        run: npm run db:migrate

  # SSH deploy to the develop host only.
  # Production CD is out of scope — do not add a production job here.
  #
  # Required repository secrets (fail early if any is empty):
  #   DEPLOY_HOST
  #   DEPLOY_USER
  #   DEPLOY_SSH_KEY
  #
  # Host path: /var/www/html/jehovahs-light.ink.net.tw/
  # PM2 name: jehovahs-light (from deploy/ecosystem.config.cjs).
  # Do not assume numeric id 14 — `pm2 reload 14` does not switch an existing
  # `npm start` / `next start` process to standalone.
  # PORT must already exist in the host .env — this job never edits package.json.
  #
  # Sibling apps on the same host must not be touched:
  #   /var/www/html/ai.srdc.org.tw
  #   /var/www/html/member.rsh-care.com
  deploy-develop:
    name: SSH deploy develop
    needs: lint-and-build
    if: >
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    steps:
      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "error: repository secret DEPLOY_HOST is missing or empty"
            missing=1
          fi
          if [ -z "${DEPLOY_USER}" ]; then
            echo "error: repository secret DEPLOY_USER is missing or empty"
            missing=1
          fi
          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "error: repository secret DEPLOY_SSH_KEY is missing or empty"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo
            echo "Set DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY on this repo"
            echo "before the first live SSH deploy. The workflow is shipped;"
            echo "a missing-secret failure here is expected until they exist."
            echo "See docs/ci-cd.md."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pass the CI-tested SHA into the remote script.
          envs: EXPECTED_SHA
          # Do not pass script_stop — invalid / problematic on this action
          # (same lesson as ai.srdc.org.tw / member.rsh-care.com). Fail-fast
          # is set -euo pipefail in the remote script below.
          command_timeout: 30m
          script: |
            set -euo pipefail

            DEPLOY_PATH="/var/www/html/jehovahs-light.ink.net.tw"
            # Never operate on sibling apps on this host.
            FORBIDDEN_PATHS="/var/www/html/ai.srdc.org.tw /var/www/html/member.rsh-care.com"

            if [ -s "${HOME}/.nvm/nvm.sh" ]; then
              # shellcheck disable=SC1091
              . "${HOME}/.nvm/nvm.sh"
            fi
            export PATH="${PATH}:/usr/local/bin:${HOME}/.local/bin"

            if [ ! -d "${DEPLOY_PATH}" ]; then
              echo "error: deploy path does not exist: ${DEPLOY_PATH}"
              exit 1
            fi

            cd "${DEPLOY_PATH}"
            pwd_now="$(pwd -P)"
            if [ "${pwd_now}" != "${DEPLOY_PATH}" ] && [ "${pwd_now}" != "${DEPLOY_PATH%/}" ]; then
              echo "error: refused to run outside ${DEPLOY_PATH} (pwd=${pwd_now})"
              exit 1
            fi
            for forbidden in ${FORBIDDEN_PATHS}; do
              case "${pwd_now}" in
                "${forbidden}"|"${forbidden}"/*)
                  echo "error: refused to touch sibling app path ${forbidden}"
                  exit 1
                  ;;
              esac
            done

            if [ ! -d .git ]; then
              echo "error: ${DEPLOY_PATH} is not a git working tree"
              exit 1
            fi

            # Fail on a dirty tree. Do NOT git reset --hard — that is the
            # same lesson as the ai.srdc.org.tw dirty package.json incident.
            if [ -n "$(git status --porcelain)" ]; then
              echo "error: working tree is dirty at ${DEPLOY_PATH}"
              echo "Refuse to deploy (no git reset --hard)."
              echo "Inspect and commit or stash local edits on the host, then re-run."
              git status --porcelain
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "error: missing ${DEPLOY_PATH}/.env"
              echo "PORT must already be set in the host .env. Copy .env.example and set PORT + DB_*."
              echo "Never add --port to package.json start."
              exit 1
            fi
            if ! grep -qE '^[[:space:]]*PORT=' .env; then
              echo "error: PORT is not set in ${DEPLOY_PATH}/.env"
              echo "PORT comes from the host .env only. package.json start stays \"next start\"."
              exit 1
            fi

            # Pin to the commit this workflow just tested (github.sha).
            # Do not `git pull` origin/develop tip — it may have moved.
            EXPECTED_SHA="${EXPECTED_SHA:-}"
            if ! printf '%s' "${EXPECTED_SHA}" | grep -qxE '[0-9a-f]{40}'; then
              echo "error: EXPECTED_SHA is missing or not a 40-char lowercase hex SHA"
              echo "EXPECTED_SHA='${EXPECTED_SHA}'"
              exit 1
            fi

            git fetch origin develop
            git fetch origin "${EXPECTED_SHA}"
            if ! git cat-file -e "${EXPECTED_SHA}^{commit}"; then
              echo "error: tested SHA ${EXPECTED_SHA} is not a commit after fetch"
              exit 1
            fi

            # Guard NEXT_PUBLIC_APP_URL on the current host .env before
            # checkout / npm ci / build. Runs after the dirty-worktree
            # check and after fetch so `git show SHA:deploy/check-app-url.sh`
            # can resolve, without touching the worktree. A failed guard
            # leaves the running site unchanged.
            # `set +x` inside the checker prevents xtrace leaks.
            # Chain onto any existing EXIT trap instead of replacing it.
            existing_exit_trap="$(trap -p EXIT 2>/dev/null || true)"
            existing_exit_cmd=""
            if [ -n "${existing_exit_trap}" ]; then
              existing_exit_cmd="${existing_exit_trap#*\'}"
              existing_exit_cmd="${existing_exit_cmd%\'*}"
            fi
            checker="/tmp/jl-check-app-url.$$.sh"
            cleanup_checker() {
              rm -f "${checker}"
              if [ -n "${existing_exit_cmd}" ]; then
                eval "${existing_exit_cmd}"
              fi
            }
            trap cleanup_checker EXIT
            git show "${EXPECTED_SHA}:deploy/check-app-url.sh" > "${checker}"
            set +x
            bash "${checker}" .env

            current_branch="$(git rev-parse --abbrev-ref HEAD)"
            if [ "${current_branch}" != "develop" ]; then
              echo "host is on '${current_branch}', moving develop to ${EXPECTED_SHA}"
            fi
            # checkout -B keeps the host on local develop at the tested SHA.
            # Not git reset --hard (dirty tree already rejected above).
            git checkout -B develop "${EXPECTED_SHA}"

            actual="$(git rev-parse HEAD)"
            if [ "${actual}" != "${EXPECTED_SHA}" ]; then
              echo "error: HEAD ${actual} does not match CI-tested SHA ${EXPECTED_SHA}"
              exit 1
            fi
            echo "deploying tested SHA ${EXPECTED_SHA}"

            command -v node >/dev/null
            command -v npm >/dev/null
            command -v pm2 >/dev/null
            echo "node $(node -v) npm $(npm -v)"

            npm ci
            npm run build

            if [ ! -d .next/standalone ]; then
              echo "error: .next/standalone missing after build (next.config.ts output: 'standalone')"
              exit 1
            fi
            # Belt-and-suspenders: npm postbuild already copies these into
            # standalone. Repeat here so a missed/mistyped host-side cp cannot
            # drop /globe/earth-blue-marble.jpg. Idempotent rm + cp -a.
            # https://nextjs.org/docs/app/api-reference/config/next-config-js/output
            if [ -d public ]; then
              rm -rf .next/standalone/public
              cp -a public .next/standalone/public
            fi
            mkdir -p .next/standalone/.next
            if [ ! -d .next/static ]; then
              echo "error: .next/static missing after build"
              exit 1
            fi
            rm -rf .next/standalone/.next/static
            cp -a .next/static .next/standalone/.next/static

            # Apply Drizzle migrations before PM2 reload. CREATE TABLE IF NOT
            # EXISTS is safe when gps_consent / lit_locations already exist.
            # Source host .env so drizzle-kit sees DB_HOST / DB_USER /
            # DB_PASSWORD / DB_NAME (never printed).
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            npm run db:migrate

            # Identify by name jehovahs-light from the ecosystem file.
            # `pm2 reload 14` is not enough to change npm start → standalone.
            # startOrReload --update-env, with delete-by-name + start fallback.
            # Fails if the running script is still next start (see deploy/pm2-sync.sh).
            export DEPLOY_PATH
            bash deploy/pm2-sync.sh

            echo "deploy ok: ${DEPLOY_PATH} @ ${EXPECTED_SHA} (PM2 name jehovahs-light / ecosystem). PORT left unchanged in host .env."
