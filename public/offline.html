<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04060e" />
    <title>點亮地球 · Light Up the Earth</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04060e;
        color: #fffbeb;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        padding: 1.5rem;
        max-width: 22rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: rgba(254, 243, 199, 0.7);
        font-size: 0.875rem;
        line-height: 1.5;
      }
      button {
        border: 1px solid rgba(253, 230, 138, 0.25);
        border-radius: 9999px;
        background: rgba(252, 211, 77, 0.9);
        color: #171717;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.5rem 1.25rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>目前離線 · You're offline</h1>
      <p>連上網路後，再回來點亮地球。<br />Reconnect to see the lights around the world.</p>
      <button type="button" onclick="location.reload()">重試 · Retry</button>
    </main>
  </body>
</html>
